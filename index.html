<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dead Girls Club</title>

<!-- PS2-style instant redirect -->
<script>
setTimeout(function() {
    window.location.replace("https://www.ebay.com/str/deadgirls");
}, 600); /* 0.6 seconds so the text is visible */
</script>

<style>
    body {
        margin: 0;
        background-color: #cfcfcf; /* PS2 grey */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: "Courier New", monospace; /* PS2 system font */
        color: #000;
        font-size: 1.4rem;
        letter-spacing: 2px;
        text-transform: lowercase;
        position: relative;
        overflow: hidden;
    }

    /* Subtle PS2 flicker */
    @keyframes flicker {
        0% { opacity: 0.7; }
        50% { opacity: 1; }
        100% { opacity: 0.8; }
    }

    .ps2-text {
        animation: flicker 0.3s ease-in-out infinite alternate;
    }
</style>
</head>

<body>
    <div class="ps2-text">kill your idols</div>
</body>
</html>
